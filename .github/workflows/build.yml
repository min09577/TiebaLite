name: Build, Deploy

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        if: env.HAS_KEYSTORE == 'true'
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: ${{ vars.RELEASE_KEYSTORE }}
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Generate keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo keystore.file="${{ vars.RELEASE_KEYSTORE }}" >> keystore.properties
          echo keystore.password="${{ secrets.RELEASESTOREPASSWORD }}" >> keystore.properties
          echo keystore.key.alias="${{ vars.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo keystore.key.password="${{ secrets.RELEASEKEYPASSWORD }}" >> keystore.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "TiebaLite-debug"
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "TiebaLite-release"
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Mapping
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: ./app/build/outputs/mapping/release

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Creating release $TAG..."
          gh release create "$TAG" --title "$TAG" --notes "Automated APK build. Downloads below."
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"
