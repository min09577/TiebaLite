name: Build, Deploy

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        if: env.HAS_KEYSTORE == 'true'
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: ${{ vars.RELEASE_KEYSTORE }}
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Generate keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo keystore.file="${{ vars.RELEASE_KEYSTORE }}" >> keystore.properties
          echo keystore.password="${{ secrets.RELEASESTOREPASSWORD }}" >> keystore.properties
          echo keystore.key.alias="${{ vars.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo keystore.key.password="${{ secrets.RELEASEKEYPASSWORD }}" >> keystore.properties

      - name: Generate consistent debug keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          KEYSTORE_FILE=app/tblite_debug.jks
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=TiebaLite" \
              -storepass tiebalite \
              -keypass tiebalite \
              -alias tiebalite
          fi
          echo keystore.file="$KEYSTORE_FILE" > keystore.properties
          echo keystore.password=tiebalite >> keystore.properties
          echo keystore.key.alias=tiebalite >> keystore.properties
          echo keystore.key.password=tiebalite >> keystore.properties

      - name: Commit keystore if new
        if: env.HAS_KEYSTORE != 'true'
        run: |
          if git diff --name-only | grep -q tblite_debug.jks; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/tblite_debug.jks
            git commit -m "chore: add consistent signing keystore [skip ci]"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "TiebaLite-debug"
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "TiebaLite-release"
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Mapping
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: ./app/build/outputs/mapping/release

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Deleting old release if exists..."
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Creating release $TAG..."
          DESC="## $TAG
          
          ### ⚡ 全量一键签到 · 3000 吧全覆盖
          智能分页引擎拉取所有关注的贴吧，通知栏实时显示进度。
          
          > 🔋 **首次签到请关闭电池优化策略，避免后台被杀。**
          
          ---
          | APK | 适用场景 |
          |------|------|
          | release | 正式使用（已混淆优化，## 10MB） |
          | debug | 测试调试（保留完整日志）
          "
          gh release create "$TAG" --title "$TAG" --notes "$DESC"
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"
